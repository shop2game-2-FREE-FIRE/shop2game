<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق بلدنا - المغرب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        tajawal: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-stone-50 dark:bg-slate-950 min-h-screen text-slate-800 dark:text-slate-100">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // دالة مساعدة لتشغيل أيقونات Lucide داخل الـ HTML المباشر
        function Icon({ name, size = 20, className = "", fill = "none" }) {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`} fill={fill}></i>;
        }

        const CATEGORIES = [
            { id: "electronics", name: "إلكترونيات", img: "https://images.unsplash.com/photo-1498049794561-7780e7231661?w=200&q=80" },
            { id: "phones", name: "هواتف", img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=200&q=80" },
            { id: "computers", name: "حواسيب", img: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=200&q=80" },
            { id: "clothes", name: "ملابس", img: "https://images.unsplash.com/photo-1445205170230-053b83016050?w=200&q=80" },
            { id: "cars", name: "سيارات", img: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=200&q=80" },
            { id: "bikes", name: "دراجات", img: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=200&q=80" },
            { id: "realestate", name: "عقارات", img: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=200&q=80" },
            { id: "games", name: "ألعاب", img: "https://images.unsplash.com/photo-1486401899868-0e435ed85128?w=200&q=80" }
        ];

        const SEED_PRODUCTS = [
            { id: "p1", title: "آيفون 13 برو - حالة ممتازة", price: 6400, oldPrice: 7200, category: "phones", img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600&q=80", desc: "آيفون 13 برو، 256 جيجا، بطارية 91%، مع العلبة والشاحن الأصلي.", city: "الدار البيضاء", condition: "مستعمل بحالة ممتازة", sellerName: "أحمد التازي", sellerPhone: "+212600000000", rating: 4.6 },
            { id: "p2", title: "لابتوب ديل XPS 15", price: 12500, oldPrice: null, category: "computers", img: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=600&q=80", desc: "معالج i7، رام 16 جيجا، تخزين SSD 512 جيجا. مناسب للتصميم والبرمجة.", city: "الرباط", condition: "جديد", sellerName: "متجر التقنية", sellerPhone: "+212611111111", rating: 4.9 },
            { id: "p3", title: "سماعات لاسلكية عالية الجودة", price: 450, oldPrice: 600, category: "electronics", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&q=80", desc: "سماعات بلوتوث مع خاصية إلغاء الضوضاء وعمر بطارية طويل.", city: "فاس", condition: "جديد", sellerName: "سارة العلمي", sellerPhone: "+212622222222", rating: 4.3 }
        ];

        const fmt = (n) => new Intl.NumberFormat("ar-MA").format(n) + " DH";

        /* المكون الرئيسي للتطبيق */
        function App() {
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem("mp-user") || "null"));
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem("mp-products") || JSON.stringify(SEED_PRODUCTS)));
            const [cart, setCart] = useState(() => JSON.parse(localStorage.getItem("mp-cart") || "[]"));
            const [favorites, setFavorites] = useState(() => JSON.parse(localStorage.getItem("mp-favs") || "[]"));
            const [darkMode, setDarkMode] = useState(() => JSON.parse(localStorage.getItem("mp-dark") || "false"));
            const [page, setPage] = useState("home");
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [search, setSearch] = useState("");
            const [authStep, setAuthStep] = useState("role");
            const [authRole, setAuthRole] = useState(null);

            // حفظ البيانات تلقائياً في المتصفح عند حدوث أي تغيير
            useEffect(() => { localStorage.setItem("mp-user", JSON.stringify(user)); }, [user]);
            useEffect(() => { localStorage.setItem("mp-products", JSON.stringify(products)); }, [products]);
            useEffect(() => { localStorage.setItem("mp-cart", JSON.stringify(cart)); }, [cart]);
            useEffect(() => { localStorage.setItem("mp-favs", JSON.stringify(favorites)); }, [favorites]);
            useEffect(() => { 
                localStorage.setItem("mp-dark", JSON.stringify(darkMode));
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            // تشغيل أيقونات Lucide عند التنقل بين الصفحات
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [page, user, authStep]);

            const toggleFav = (id) => setFavorites(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]);
            
            const addToCart = (product) => {
                setCart(c => {
                    const exist = c.find(i => i.id === product.id);
                    if (exist) return c.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
                    return [...c, { id: product.id, qty: 1 }];
                });
            };

            const filteredProducts = useMemo(() => {
                let list = products;
                if (selectedCategory) list = list.filter(p => p.category === selectedCategory);
                if (search.trim()) {
                    const q = search.trim().toLowerCase();
                    list = list.filter(p => p.title.toLowerCase().includes(q) || p.city.includes(q));
                }
                return list;
            }, [products, selectedCategory, search]);

            // واجهة تسجيل الدخول واختيار الحساب
            if (!user) {
                if (authStep === "role") {
                    return (
                        <div class="min-h-screen bg-gradient-to-b from-slate-900 to-slate-800 flex flex-col items-center justify-center px-6 text-center text-white">
                            <div class="w-16 h-16 rounded-2xl bg-amber-400 flex items-center justify-center mb-4 text-slate-900">
                                <Icon name="tag" size={28} />
                            </div>
                            <h1 class="font-cairo text-2xl font-extrabold mb-1">سوق بلدنا (المغرب)</h1>
                            <p class="text-slate-300 text-sm mb-10">منصتك المفضلة للبيع والشراء مجاناً</p>
                            <div class="grid grid-cols-2 gap-4 w-full max-w-xs text-slate-850 text-slate-900">
                                <button onClick={() => { setAuthRole("buyer"); setAuthStep("form"); }} class="bg-white rounded-2xl p-5 flex flex-col items-center gap-2 active:scale-95 transition-transform">
                                    <Icon name="shopping-cart" size={28} className="text-amber-500" />
                                    <span class="font-cairo font-bold text-sm">مشتري</span>
                                </button>
                                <button onClick={() => { setAuthRole("seller"); setAuthStep("form"); }} class="bg-white rounded-2xl p-5 flex flex-col items-center gap-2 active:scale-95 transition-transform">
                                    <Icon name="store" size={28} className="text-emerald-600" />
                                    <span class="font-cairo font-bold text-sm">بائع</span>
                                </button>
                            </div>
                        </div>
                    );
                }
                return (
                    <LoginForm onFinish={(data) => setUser({ ...data, role: authRole })} onBack={() => setAuthStep("role")} role={authRole} />
                );
            }

            // تطبيق الواجهة الرئيسية والصفحات المتعددة
            return (
                <div class="max-w-md mx-auto bg-white dark:bg-slate-900 min-h-screen pb-20 shadow-xl relative overflow-hidden">
                    {/* الهيدر العلوي */}
                    <div class="sticky top-0 z-20 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-stone-100 dark:border-slate-800 px-4 h-14 flex items-center justify-between">
                        <h1 class="font-cairo font-bold text-base text-amber-500">سوق بلدنا 🇲🇦</h1>
                        <button onClick={() => setDarkMode(!darkMode)} class="w-9 h-9 rounded-full bg-stone-100 dark:bg-slate-800 flex items-center justify-center">
                            <Icon name={darkMode ? "sun" : "moon"} size={16} className={darkMode ? "text-amber-400" : "text-slate-500"} />
                        </button>
                    </div>

                    {/* محتوى الصفحات */}
                    {page === "home" && (
                        <div class="p-4">
                            <div class="mb-4 relative">
                                <Icon name="search" size={18} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="ابحث عن هاتف، حاسوب، مدينة..." class="w-full bg-stone-100 dark:bg-slate-800 dark:text-white rounded-xl py-2.5 pr-10 pl-4 text-sm outline-none border border-transparent focus:border-amber-400" />
                            </div>

                            <h2 class="font-cairo font-bold text-sm mb-3">الأقسام</h2>
                            <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide mb-6">
                                {CATEGORIES.map(c => (
                                    <button key={c.id} onClick={() => { setSelectedCategory(c.id); setPage("results"); }} class="flex flex-col items-center shrink-0 w-16">
                                        <div class="w-12 h-12 rounded-xl overflow-hidden mb-1 border border-stone-200 dark:border-slate-700">
                                            <img src={c.img} class="w-full h-full object-cover" />
                                        </div>
                                        <span class="text-[11px] text-slate-600 dark:text-slate-300">{c.name}</span>
                                    </button>
                                ))}
                            </div>

                            <h2 class="font-cairo font-bold text-sm mb-3">المنتجات المتاحة</h2>
                            <div class="grid grid-cols-2 gap-3">
                                {filteredProducts.map(p => (
                                    <div key={p.id} onClick={() => { setSelectedProduct(p); setPage("product"); }} class="bg-stone-50 dark:bg-slate-800 rounded-xl overflow-hidden border border-stone-200/60 dark:border-slate-700/50 cursor-pointer">
                                        <img src={p.img} class="w-full h-32 object-cover" />
                                        <div class="p-2">
                                            <p class="text-xs font-bold line-clamp-1">{p.title}</p>
                                            <p class="text-amber-500 font-extrabold text-xs mt-1">{fmt(p.price)}</p>
                                            <p class="text-[10px] text-slate-400 mt-1 flex items-center gap-0.5"><Icon name="map-pin" size={10} />{p.city}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {page === "results" && (
                        <div class="p-4">
                            <button onClick={() => { setSelectedCategory(null); setPage("home"); }} class="mb-4 text-xs text-amber-500 flex items-center gap-1">← العودة للرئيسية</button>
                            <div class="grid grid-cols-2 gap-3">
                                {filteredProducts.map(p => (
                                    <div key={p.id} onClick={() => { setSelectedProduct(p); setPage("product"); }} class="bg-stone-50 dark:bg-slate-800 rounded-xl overflow-hidden border border-stone-200 dark:border-slate-700 cursor-pointer">
                                        <img src={p.img} class="w-full h-32 object-cover" />
                                        <div class="p-2">
                                            <p class="text-xs font-bold">{p.title}</p>
                                            <p class="text-amber-500 font-extrabold text-sm">{fmt(p.price)}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {page === "product" && selectedProduct && (
                        <div class="p-4">
                            <button onClick={() => setPage("home")} class="mb-4 text-xs text-amber-500">← العودة للرئيسية</button>
                            <img src={selectedProduct.img} class="w-full h-56 object-cover rounded-xl mb-4" />
                            <h2 class="font-cairo font-extrabold text-lg">{selectedProduct.title}</h2>
                            <p class="text-amber-500 font-black text-xl my-2">{fmt(selectedProduct.price)}</p>
                            <p class="text-xs text-slate-400 mb-2">المدينة: {selectedProduct.city} | الحالة: {selectedProduct.condition}</p>
                            <p class="text-sm text-slate-500 dark:text-slate-400 border-t border-stone-100 dark:border-slate-800 pt-3">{selectedProduct.desc}</p>
                            
                            <div class="grid grid-cols-2 gap-3 mt-6">
                                <a href={`tel:${selectedProduct.sellerPhone}`} class="bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-center text-sm flex items-center justify-center gap-1">
                                    <Icon name="phone" size={14} /> إتصال
                                </a>
                                <a href={`https://wa.me/${selectedProduct.sellerPhone.replace('+','')}`} target="_blank" class="bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-center text-sm flex items-center justify-center gap-1">
                                    <Icon name="message-circle" size={14} /> واتساب
                                </a>
                            </div>
                        </div>
                    )}

                    {page === "profile" && (
                        <div class="p-4 text-center">
                            <div class="w-16 h-16 bg-amber-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-2 text-amber-600 text-xl font-bold">
                                {user.name.charAt(0)}
                            </div>
                            <h3 class="font-bold text-base">{user.name}</h3>
                            <p class="text-xs text-slate-400 mt-1" dir="ltr">{user.phone}</p>
                            <p class="text-xs text-slate-400">{user.city}</p>

                            <button onClick={() => { localStorage.clear(); window.location.reload(); }} class="w-full mt-10 bg-rose-500 text-white font-bold py-2.5 rounded-xl text-sm">
                                تسجيل الخروج وحذف الحساب
                            </button>
                        </div>
                    )}

                    {/* شريط التنقل السفلي */}
                    <div class="fixed bottom-0 inset-x-0 bg-white dark:bg-slate-900 border-t border-stone-200 dark:border-slate-800 flex justify-around items-center h-16 z-30 max-w-md mx-auto">
                        <button onClick={() => setPage("home")} class={`flex flex-col items-center flex-1 ${page === "home" ? "text-amber-500" : "text-slate-400"}`}>
                            <Icon name="home" size={18} />
                            <span class="text-[10px] mt-0.5">الرئيسية</span>
                        </button>
                        <button onClick={() => setPage("profile")} class={`flex flex-col items-center flex-1 ${page === "profile" ? "text-amber-500" : "text-slate-400"}`}>
                            <Icon name="user" size={18} />
                            <span class="text-[10px] mt-0.5">حسابي</span>
                        </button>
                    </div>
                </div>
            );
        }

        // مكون استمارة البيانات الشخصية للمستخدم
        function LoginForm({ onFinish, onBack, role }) {
            const [form, setForm] = useState({ name: "", phone: "", city: "" });
            return (
                <div class="min-h-screen bg-stone-50 text-slate-900 flex flex-col p-6 pt-12 max-w-md mx-auto">
                    <button onClick={onBack} class="self-start text-xs text-slate-400 mb-6">← رجوع لصفحة الاختيار</button>
                    <h2 class="font-cairo text-xl font-extrabold mb-1">{role === "seller" ? "إنشاء حساب بائع" : "إنشاء حساب مشتري"}</h2>
                    <p class="text-slate-400 text-xs mb-6">المرجو إدخال معلوماتك الشخصية للمتابعة داخل سوق المغرب</p>
                    
                    <div class="flex flex-col gap-3">
                        <input value={form.name} onChange={(e) => setForm({...form, name: e.target.value})} placeholder="الاسم الكامل" class="bg-white border border-stone-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-amber-400" />
                        <input value={form.phone} onChange={(e) => setForm({...form, phone: e.target.value})} placeholder="رقم الهاتف (مثال: +212600000000)" class="bg-white border border-stone-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-amber-400" dir="ltr" />
                        <input value={form.city} onChange={(e) => setForm({...form, city: e.target.value})} placeholder="المدينة المغربية (مثال: فاس)" class="bg-white border border-stone-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-amber-400" />
                    </div>

                    <button disabled={!form.name || !form.phone} onClick={() => onFinish(form)} class="mt-8 bg-amber-400 disabled:opacity-40 text-slate-900 font-cairo font-bold py-3 rounded-xl shadow-md transition-opacity">
                        دخول إلى السوق المغربي
                    </button>
                </div>
            );
        }

        // ربط تطبيق الـ React بـ HTML
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
